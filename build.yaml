

targets:
  $default:
    builders:
      source_gen:combining_builder:
        generate_for:
          - '**/*_dto.dart'
          - '**/*_model.dart'
        options:
          ignore_for_file:
            - cast_nullable_to_non_nullable
            - avoid_annotating_with_dynamic

      mek_data_class_generator:
        generate_for:
          - '**/*_dto.dart'
          - '**/*_model.dart'

      json_serializable:
        generate_for:
          - '**/*_dto.dart'
          - '**/*_model.dart'
        options:
          create_to_json: false
          create_factory: false
